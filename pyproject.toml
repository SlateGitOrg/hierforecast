[project]
name = "hierforecast"
version = "0.1.0"
description = "Hierarchically reconciled energy demand forecasts evaluated on pinball loss, so regional forecasts sum to national and the tail is right."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
